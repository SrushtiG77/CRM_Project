{% extends "base.html" %}

{% block content %}
<div class="fixed inset-0 flex items-center justify-center -m-4 md:-m-8">
    <div class="absolute inset-0 bg-cover bg-center opacity-30" style="background-image: url('https://images.unsplash.com/photo-1610427926127-14283ba8eb62?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-white via-white/80 to-white/40 backdrop-blur-sm"></div>
    
    <div class="relative w-full max-w-md p-8 glass-gold rounded-3xl shadow-xl shadow-gold-900/5 transform hover:scale-[1.01] transition-transform duration-300">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-white rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-md border border-gold-200">
                <i class="fa-solid fa-gem text-4xl text-transparent bg-clip-text bg-gradient-to-br from-gold-400 to-gold-600"></i>
            </div>
            <h2 class="text-3xl font-bold text-slate-900 mb-2">Welcome to Aurum</h2>
            <p class="text-slate-500">Sign in to manage your elegant CRM</p>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-gold-500/70"></i>
                    </div>
                    <input type="text" name="username" required 
                        class="w-full pl-11 pr-4 py-3 bg-white border border-gold-200 rounded-xl focus:ring-2 focus:ring-gold-500/50 focus:border-gold-500 text-slate-800 placeholder-slate-400 transition-all outline-none shadow-inner" 
                        placeholder="Admin or Staff username">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gold-500/70"></i>
                    </div>
                    <input type="password" name="password" required 
                        class="w-full pl-11 pr-4 py-3 bg-white border border-gold-200 rounded-xl focus:ring-2 focus:ring-gold-500/50 focus:border-gold-500 text-slate-800 placeholder-slate-400 transition-all outline-none shadow-inner" 
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-gold-600 to-gold-400 hover:from-gold-500 hover:to-gold-300 text-white font-bold rounded-xl shadow-[0_0_15px_rgba(215,148,39,0.4)] transition-all hover:shadow-[0_0_25px_rgba(215,148,39,0.6)] transform hover:-translate-y-1">
                Sign In <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-slate-500">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="text-gold-600 hover:text-gold-500 font-medium">Register here</a></p>
        </div>
        <div class="mt-4 text-center text-xs text-slate-400">
            <p>Admin Login: admin / admin123</p>
        </div>
    </div>
</div>
{% endblock %}
